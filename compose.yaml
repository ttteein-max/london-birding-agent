services:
  expedition-planner:
    build: .
    ports:
      - "8080:8000"
    environment:
      BIODIVERSITY_PUBLIC_DEMO: "true"
      BIODIVERSITY_ALLOWED_RUN_MODES: fixture/scripted
      BIODIVERSITY_BASEMAP_STYLE_URL: https://tiles.openfreemap.org/styles/liberty
      BIODIVERSITY_MUTATIONS_PER_MINUTE: "20"
      BIODIVERSITY_MAX_CONCURRENT_OPERATIONS: "2"
      BIODIVERSITY_MAX_DEMO_THREADS: "100"
      BIODIVERSITY_MAX_STORAGE_MB: "192"
      BIODIVERSITY_RUN_RETENTION_HOURS: "24"
    volumes:
      - biodiversity-demo-data:/var/lib/biodiversity

volumes:
  biodiversity-demo-data:
