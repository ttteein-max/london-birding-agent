name: Offline verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff==0.16.6

      - name: Lint Python sources
        run: python -m ruff check .

      - name: Compile Python sources
        run: python -m compileall -q app scripts tests

      - name: Run offline tests
        run: python -m pytest -m "not live" -q

      - name: Run Phase 0.1 feasibility validation
        run: python -m scripts.phase0_feasibility
